<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1effa"><title>心屿 · 给情绪一个停靠的地方</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="心屿首页"><span class="brand-symbol">♥</span><span>心屿<small>MIND ISLAND</small></span></a>
      <div class="workspace-label">你的情绪小空间</div>
      <nav aria-label="主导航">
        <button class="nav-item active" data-view="today"><span data-icon="grid"></span>今日空间<span class="nav-dot"></span></button>
        <button class="nav-item" data-view="exercises"><span data-icon="leaf"></span>练习室</button>
        <button class="nav-item" data-view="records"><span data-icon="book"></span>我的记录</button>
      </nav>
      <div class="sidebar-divider"></div>
      <p class="sidebar-label">给自己的小提醒</p>
      <div class="sidebar-note"><span class="note-spark">✧</span><p>不用一下子变好，<br>今天的一小步<br>也很重要。</p><div class="note-hills"><span></span><i></i><b>✿</b></div></div>
      <div class="sidebar-bottom"><button class="support-link" data-action="help"><span data-icon="lifebuoy"></span>我需要一些帮助 <span>↗</span></button><div class="profile"><div class="avatar">Y</div><div>我的小岛<small>今天也在慢慢成长</small></div><span class="profile-spark">✧</span></div></div>
    </aside>
    <main>
      <header class="topbar"><div><span class="breadcrumb">我的小岛</span><span class="slash">/</span><span id="page-crumb">今日空间</span></div><div class="topbar-right"><span class="demo-badge"><i></i>交互演示</span><button class="icon-button" data-action="help" aria-label="寻求帮助" title="寻求帮助"><span data-icon="lifebuoy"></span></button><button class="icon-button" data-action="privacy" aria-label="本地数据说明"><span data-icon="shield"></span></button><div class="small-avatar">Y</div></div></header>
      <div id="page" class="page"></div>
      <footer>每一种情绪，都值得被看见。<span>心理健康技能练习 · 不提供诊断或治疗</span></footer>
    </main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
